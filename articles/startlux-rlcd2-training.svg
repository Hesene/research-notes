<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">RLCD² 中文训练流程</title>
  <desc id="desc">RLCD²从推理监督模型初始化可训练策略、冻结评分器和冻结参考策略。它筛选初始置信度低于0.9的决策题，在线生成多条推理轨迹，用冻结评分器评价推理带来的概率质量增量，组内比较后通过带KL约束的策略梯度更新生成策略。</desc>
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#2b7a91"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1a2435" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#536174"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5b5bd6"/>
    </marker>
    <style>
      .title { font: 700 42px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 21px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; fill: #5e6d82; }
      .role-name { font: 700 25px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; fill: #172033; }
      .role-desc { font: 400 18px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; fill: #5e6d82; }
      .badge { font: 700 15px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; letter-spacing: 1.5px; }
      .step-title { font: 700 27px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; fill: #172033; }
      .body { font: 400 20px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; fill: #435166; }
      .small { font: 400 17px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; fill: #69788d; }
      .formula { font: 400 23px "Cambria Math", "Microsoft YaHei", serif; fill: #172033; }
      .takeaway { font: 700 22px "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; fill: #273449; }
      .edge { fill: none; stroke: #536174; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #5b5bd6; stroke-width: 4; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect x="1" y="1" width="1598" height="1118" rx="24" fill="#f8fafc" stroke="#d8dee8" stroke-width="2"/>
  <rect x="1" y="1" width="1598" height="16" rx="8" fill="url(#topbar)"/>

  <text class="title" x="72" y="80">RLCD²：怎样把“有用且会停止”的推理训练出来</text>
  <text class="subtitle" x="72" y="119">不训练 gate，也不需要标准思维链；训练对象只有负责生成 reasoning 的策略模型。</text>

  <text class="badge" x="72" y="175" fill="#5b5bd6">同一个 REASONING-SFT CHECKPOINT，复制成三个训练角色</text>

  <g filter="url(#shadow)">
    <rect x="72" y="198" width="456" height="112" rx="17" fill="#f1efff" stroke="#5b5bd6" stroke-width="2.5"/>
    <text class="badge" x="104" y="231" fill="#5b5bd6">会更新</text>
    <text class="role-name" x="104" y="268">当前策略 πθ</text>
    <text class="role-desc" x="104" y="295">生成 reasoning token，接收策略梯度</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="572" y="198" width="456" height="112" rx="17" fill="#eaf7f5" stroke="#2d867c" stroke-width="2.5"/>
    <text class="badge" x="604" y="231" fill="#2d867c">冻结</text>
    <text class="role-name" x="604" y="268">概率评分器 f</text>
    <text class="role-desc" x="604" y="295">读取推理前 p₀ 与推理后 p₁</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1072" y="198" width="456" height="112" rx="17" fill="#f1f3f6" stroke="#7c8797" stroke-width="2.5"/>
    <text class="badge" x="1104" y="231" fill="#687587">冻结</text>
    <text class="role-name" x="1104" y="268">参考策略 πref</text>
    <text class="role-desc" x="1104" y="295">用 KL 限制策略偏离初始模型</text>
  </g>

  <text class="badge" x="72" y="370" fill="#5b5bd6">每个带标签的决策题 (x, t) 都执行下面的在线训练闭环</text>

  <g filter="url(#shadow)">
    <rect x="72" y="394" width="430" height="218" rx="18" fill="#ffffff" stroke="#66a89f" stroke-width="2.5"/>
    <circle cx="114" cy="437" r="24" fill="#e4f4f1"/>
    <text class="step-title" x="114" y="446" text-anchor="middle" fill="#2d867c">1</text>
    <text class="step-title" x="154" y="446">先判断是否值得思考</text>
    <text class="body" x="108" y="492">冻结评分器先做一次无推理 readout</text>
    <text class="formula" x="108" y="534">p₀ = f(x)</text>
    <rect x="108" y="553" width="330" height="38" rx="19" fill="#eaf7f5"/>
    <text class="small" x="273" y="578" text-anchor="middle" fill="#2d867c">只保留 max(p₀) &lt; 0.9 的困难题</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="585" y="394" width="430" height="218" rx="18" fill="#ffffff" stroke="#8b91df" stroke-width="2.5"/>
    <circle cx="627" cy="437" r="24" fill="#e9e7ff"/>
    <text class="step-title" x="627" y="446" text-anchor="middle" fill="#5b5bd6">2</text>
    <text class="step-title" x="667" y="446">同一道题生成 G 种思路</text>
    <text class="body" x="621" y="492">当前策略在线采样多条 reasoning</text>
    <text class="formula" x="621" y="534">τᵢ ~ πθ(· | x),  i = 1…G</text>
    <text class="small" x="621" y="575">8 token 内结束 → 视为空推理，奖励记为 0</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1098" y="394" width="430" height="218" rx="18" fill="#ffffff" stroke="#66a89f" stroke-width="2.5"/>
    <circle cx="1140" cy="437" r="24" fill="#e4f4f1"/>
    <text class="step-title" x="1140" y="446" text-anchor="middle" fill="#2d867c">3</text>
    <text class="step-title" x="1180" y="446">逐条评价“想完以后”</text>
    <text class="body" x="1134" y="492">把 τᵢ 放回上下文，重新读取选项概率</text>
    <text class="formula" x="1134" y="532">p₁,ᵢ = f(x, τᵢ)</text>
    <text class="formula" x="1134" y="570">rᵢ = 概率质量增量 − 超预算长度成本</text>
  </g>

  <path class="edge" d="M502 503 L573 503"/>
  <path class="edge" d="M1015 503 L1086 503"/>

  <g filter="url(#shadow)">
    <rect x="250" y="730" width="500" height="188" rx="18" fill="#ffffff" stroke="#c6ceda" stroke-width="2"/>
    <circle cx="292" cy="773" r="24" fill="#e9edff"/>
    <text class="step-title" x="292" y="782" text-anchor="middle" fill="#536174">4</text>
    <text class="step-title" x="332" y="782">只在同一道题内比较</text>
    <text class="body" x="286" y="829">比组内平均更好的思路得到正优势</text>
    <text class="formula" x="286" y="872">Aᵢ = clip(rᵢ − r̄, −5, 5)</text>
    <text class="small" x="286" y="902">基础难度被抵消，重点比较哪条 τ 带来更好的 p₁</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="730" width="500" height="188" rx="18" fill="#f1efff" stroke="#5b5bd6" stroke-width="2.5"/>
    <circle cx="892" cy="773" r="24" fill="#dedaff"/>
    <text class="step-title" x="892" y="782" text-anchor="middle" fill="#5b5bd6">5</text>
    <text class="step-title" x="932" y="782">强化更有用的 token 路径</text>
    <text class="body" x="886" y="829">裁剪策略梯度 + 对参考策略的 KL 约束</text>
    <text class="formula" x="886" y="872">Lpolicy + β KL(πθ || πref)</text>
    <text class="small" x="886" y="902">更新全部语言模型参数；视觉塔保持冻结</text>
  </g>

  <path class="edge" d="M1313 612 C1313 675 500 660 500 718"/>
  <path class="edge" d="M750 824 L838 824"/>
  <path class="loop" d="M1100 918 C1100 980 800 986 800 944 L800 652 C800 633 800 626 800 618"/>
  <text class="small" x="1270" y="968" text-anchor="middle" fill="#5b5bd6">更新后的策略进入下一轮采样</text>

  <rect x="72" y="1012" width="1456" height="70" rx="14" fill="#edf1f8"/>
  <text class="takeaway" x="800" y="1043" text-anchor="middle">奖励只看 reasoning 是否让最终概率分布变好，并不逐步检查推理过程。</text>
  <text class="small" x="800" y="1068" text-anchor="middle">超过 3072 token 才开始扣长度分；4096 token 是生成硬上限。</text>
</svg>
