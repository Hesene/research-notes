<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">RLCD² training loop</title>
  <desc id="desc">A reasoning-supervised checkpoint is copied into a trainable policy, a frozen scorer, and a frozen reference policy. Low-confidence labeled decisions are selected, the policy samples multiple reasoning traces, the scorer measures probability improvement after each trace, rewards are centered within each prompt, and a clipped policy-gradient objective with KL regularization updates the policy.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#2563a6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#556174"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5b5bd6"/>
    </marker>
    <style>
      .title { font: 700 42px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 21px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #627083; }
      .role { font: 700 15px "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 1.5px; }
      .node-title { font: 700 25px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .node-body { font: 400 20px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #435166; }
      .formula { font: 400 22px "Cambria Math", "Times New Roman", serif; fill: #172033; }
      .caption { font: 600 22px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #273449; }
      .small { font: 400 17px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #66758a; }
      .edge { fill: none; stroke: #556174; stroke-width: 3; marker-end: url(#arrow); }
      .edge-purple { fill: none; stroke: #5b5bd6; stroke-width: 4; marker-end: url(#arrow-purple); }
      .edge-dashed { fill: none; stroke: #8792a3; stroke-width: 2.5; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1598" height="1118" rx="24" fill="#f8fafc" stroke="#d8dee8" stroke-width="2"/>
  <rect x="1" y="1" width="1598" height="16" rx="8" fill="url(#header)"/>

  <text class="title" x="72" y="82">RLCD² training loop</text>
  <text class="subtitle" x="72" y="119">Learn reasoning traces that improve decision probabilities—and stop before they become wasteful.</text>

  <g filter="url(#shadow)">
    <rect x="485" y="155" width="630" height="76" rx="16" fill="#ffffff" stroke="#bcc6d4" stroke-width="2"/>
    <text class="node-title" x="800" y="190" text-anchor="middle">Reasoning-supervised checkpoint</text>
    <text class="small" x="800" y="217" text-anchor="middle">one initialization · three logical roles during RL</text>
  </g>

  <path class="edge-purple" d="M800 231 C800 257 330 248 330 283"/>
  <path class="edge-dashed" d="M800 231 L800 283"/>
  <path class="edge-dashed" d="M800 231 C800 257 1270 248 1270 283"/>

  <g filter="url(#shadow)">
    <rect x="105" y="285" width="450" height="112" rx="17" fill="#f2efff" stroke="#5b5bd6" stroke-width="2.5"/>
    <text class="role" x="135" y="318" fill="#5b5bd6">TRAINABLE</text>
    <text class="node-title" x="135" y="351">Current policy  πθ</text>
    <text class="node-body" x="135" y="379">samples reasoning tokens; receives gradients</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="575" y="285" width="450" height="112" rx="17" fill="#eef8f7" stroke="#2c8278" stroke-width="2.5"/>
    <text class="role" x="605" y="318" fill="#2c8278">FROZEN</text>
    <text class="node-title" x="605" y="351">Probability scorer  f</text>
    <text class="node-body" x="605" y="379">reads p₀ before and p₁ after reasoning</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1045" y="285" width="450" height="112" rx="17" fill="#f3f5f8" stroke="#7c8797" stroke-width="2.5"/>
    <text class="role" x="1075" y="318" fill="#687587">FROZEN</text>
    <text class="node-title" x="1075" y="351">Reference policy  πref</text>
    <text class="node-body" x="1075" y="379">anchors the update through KL regularization</text>
  </g>

  <text class="role" x="72" y="454" fill="#5b5bd6">ONLINE TRAINING, REPEATED FOR EACH LABELED DECISION (x, t)</text>

  <g filter="url(#shadow)">
    <rect x="72" y="478" width="430" height="202" rx="18" fill="#ffffff" stroke="#c6ceda" stroke-width="2"/>
    <circle cx="113" cy="519" r="23" fill="#e9edff"/>
    <text class="node-title" x="113" y="527" text-anchor="middle" fill="#4d54be">1</text>
    <text class="node-title" x="151" y="528">Select difficult prompts</text>
    <text class="node-body" x="108" y="570">Frozen scorer computes the initial readout</text>
    <text class="formula" x="108" y="610">p₀ = f(x)</text>
    <rect x="108" y="629" width="330" height="34" rx="17" fill="#f2efff"/>
    <text class="small" x="273" y="652" text-anchor="middle" fill="#4d54be">keep only if  max p₀ &lt; 0.9</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="585" y="478" width="430" height="202" rx="18" fill="#ffffff" stroke="#8c92de" stroke-width="2.5"/>
    <circle cx="626" cy="519" r="23" fill="#e9edff"/>
    <text class="node-title" x="626" y="527" text-anchor="middle" fill="#4d54be">2</text>
    <text class="node-title" x="664" y="528">Sample G reasoning traces</text>
    <text class="node-body" x="621" y="570">Current policy performs online rollouts</text>
    <text class="formula" x="621" y="611">τᵢ ~ πθ(· | x),   i = 1…G</text>
    <text class="small" x="621" y="650">≤ 8 tokens → empty reasoning, reward set to 0</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1098" y="478" width="430" height="202" rx="18" fill="#ffffff" stroke="#62a49b" stroke-width="2.5"/>
    <circle cx="1139" cy="519" r="23" fill="#e4f4f1"/>
    <text class="node-title" x="1139" y="527" text-anchor="middle" fill="#2c8278">3</text>
    <text class="node-title" x="1177" y="528">Score each trace</text>
    <text class="node-body" x="1134" y="568">Frozen scorer reads post-reasoning probabilities</text>
    <text class="formula" x="1134" y="607">p₁,ᵢ = f(x, τᵢ)</text>
    <text class="formula" x="1134" y="644">rᵢ = S(p₁,ᵢ,t) − S(p₀,t) − length cost</text>
  </g>

  <path class="edge" d="M502 579 L573 579"/>
  <path class="edge" d="M1015 579 L1086 579"/>
  <path class="edge-dashed" d="M800 397 L800 466"/>

  <g filter="url(#shadow)">
    <rect x="200" y="760" width="510" height="184" rx="18" fill="#ffffff" stroke="#c6ceda" stroke-width="2"/>
    <circle cx="241" cy="801" r="23" fill="#e9edff"/>
    <text class="node-title" x="241" y="809" text-anchor="middle" fill="#4d54be">4</text>
    <text class="node-title" x="279" y="810">Assign relative credit</text>
    <text class="node-body" x="236" y="851">Center rewards within the same prompt</text>
    <text class="formula" x="236" y="891">Aᵢ = clip(rᵢ − r̄, −5, 5)</text>
    <text class="small" x="236" y="923">no division by within-group standard deviation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="760" width="510" height="184" rx="18" fill="#f2efff" stroke="#5b5bd6" stroke-width="2.5"/>
    <circle cx="931" cy="801" r="23" fill="#dedcff"/>
    <text class="node-title" x="931" y="809" text-anchor="middle" fill="#4d54be">5</text>
    <text class="node-title" x="969" y="810">Update the reasoning policy</text>
    <text class="node-body" x="926" y="851">clipped token-level policy gradient</text>
    <text class="formula" x="926" y="891">Lpolicy + β KL(πθ || πref)</text>
    <text class="small" x="926" y="923">update all LM parameters · keep vision tower frozen</text>
  </g>

  <path class="edge" d="M1313 680 C1313 719 455 711 455 748"/>
  <path class="edge" d="M710 852 L878 852"/>
  <path class="edge-dashed" d="M1270 397 L1270 748"/>
  <path class="edge-purple" d="M1145 944 C1145 1020 96 1018 96 846 C96 715 576 725 627 690"/>

  <rect x="72" y="1012" width="1456" height="66" rx="14" fill="#edf1f8"/>
  <text class="caption" x="800" y="1053" text-anchor="middle">The reward judges a trace by its incremental decision value—not its writing style or step-level correctness.</text>
</svg>
