<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hesene 的研究与论文阅读笔记">
  <title>Research Notes</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11151b;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #252a33;
      --accent: #82aaff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 76px 24px 96px; }
    header { margin-bottom: 52px; }
    h1 { margin: 0 0 12px; font-size: clamp(38px, 7vw, 58px); letter-spacing: -1.5px; }
    .intro { margin: 0; color: var(--muted); font-size: 18px; }
    h2 { margin: 0 0 18px; font-size: 16px; color: var(--muted); letter-spacing: .08em; }
    .list { display: grid; gap: 16px; }
    .card {
      display: block;
      padding: 24px 26px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      transition: transform .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .date { color: var(--accent); font-size: 13px; }
    .title { margin: 7px 0 8px; font-size: 22px; font-weight: 700; }
    .summary { margin: 0; color: #b8bec8; }
    .tools { margin-top: 52px; padding-top: 24px; border-top: 1px solid var(--line); }
    .tools a { color: var(--accent); }
    footer { margin-top: 64px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Research Notes</h1>
      <p class="intro">研究、论文与模型结构阅读笔记。</p>
    </header>

    <section>
      <h2>文章</h2>
      <div class="list">
        <a class="card" href="articles/startlux-decision-v1.1-autothink.html">
          <div class="date">2026-10-17</div>
          <div class="title">StartLux-Decision v1.1 AutoThink：模型结构与 RLCD² 训练解析</div>
          <p class="summary">Qwen3.8 混合骨干、概率读出、三阶段训练、RLCD² 奖励与策略优化，以及权重文件实证。</p>
        </a>
        <a class="card" href="articles/vllm-d3.html">
          <div class="date">2026-10-15</div>
          <div class="title">vllm_sr/d3 模型结构解析</div>
          <p class="summary">模型结构、分类头前向、多问题 batching、训练插入方式与评测数据流转。</p>
        </a>
      </div>
    </section>

    <section class="tools">
      <a href="articles/article-template.html">查看空白文章模板 →</a>
    </section>

    <footer>
      <a href="https://github.com/Hesene/research-notes">GitHub Repository</a>
    </footer>
  </main>
</body>
</html>
